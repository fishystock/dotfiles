font_size 15
adjust_line_height 0
modify_font cell_width 1px

# ctrl+shift+minus overlaps with lazyvim terminal binding
map ctrl+shift+minus send_text all \x1f
map ctrl+minus decrease_font_size
map ctrl+equal increase_font_size

font_family      family="Terminus (TTF)"
bold_font        auto
italic_font      auto
bold_italic_font auto

# seti
# https://github.com/dexpota/kitty-themes/blob/master/themes/Seti.conf
background            #111213
foreground            #cacecd
cursor                #e2be21
selection_background  #303233
color0                #323232
color8                #323232
color1                #c22832
color9                #c22832
color2                #8ec43d
color10               #8ec43d
color3                #e0c64f
color11               #e0c64f
color4                #43a5d5
color12               #43a5d5
color5                #8b57b5
color13               #8b57b5
